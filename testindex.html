<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Column Layout</title>
    <link rel="stylesheet" href="3 column section style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Website Header</h1>
        </header>
        
        <div class="content">
            <section class="column left">
                <h2>Left Sidebar</h2>
                <p>This is the left sidebar. Useful for navigation or ads.</p>
            </section>
            
            <section class="column center">
                <h2>Main Content</h2>
                <p>This is the main content area. It occupies most of the space.</p>
            </section>
            
            <section class="column right">
                <h2>Right Sidebar</h2>
                <p>This is the right sidebar. Useful for additional links or widgets.</p>
            </section>
        </div>
        
        <footer>
            <p>Website Footer</p>
        </footer>
    </div>
</body>
</html>
