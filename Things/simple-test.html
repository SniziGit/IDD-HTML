<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body style="background: #000; color: white;">
    <h1>Simple JavaScript Test</h1>
    <div id="test-output">Testing...</div>
    
    <script>
        console.log('Basic JavaScript working');
        document.getElementById('test-output').innerHTML = 'JavaScript is working';
        
        // Test Three.js loading
        setTimeout(() => {
            if (typeof THREE !== 'undefined') {
                console.log('THREE.js loaded successfully');
                document.getElementById('test-output').innerHTML += '<br>THREE.js is loaded';
                
                // Test GLTFLoader
                if (typeof THREE.GLTFLoader !== 'undefined') {
                    console.log('GLTFLoader is available');
                    document.getElementById('test-output').innerHTML += '<br>GLTFLoader is available';
                } else {
                    console.error('GLTFLoader not found');
                    document.getElementById('test-output').innerHTML += '<br>GLTFLoader NOT found';
                }
            } else {
                console.error('THREE.js not loaded');
                document.getElementById('test-output').innerHTML += '<br>THREE.js NOT loaded';
            }
        }, 1000);
    </script>
</body>
</html>
